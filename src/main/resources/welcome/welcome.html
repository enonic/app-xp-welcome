<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
    <meta name="theme-color" content="#eee">
    <meta name="color-scheme" content="light dark">

    <!-- Runs before the bundle, so the key and the "anything but light or dark is system" rule
         must match THEME_STORAGE_KEY and parseTheme in @enonic/ui-utils. -->
    <script>
        try {
            const storedTheme = localStorage.getItem('enonic:theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark);
            document.documentElement.classList.toggle('dark', isDark);
            document.querySelector('meta[name="color-scheme"]').content = isDark ? 'dark' : 'light';
        } catch (e) {
            console.error('Error reading theme preference', e);
        }
    </script>

    <title>{{phrases.title}}</title>

    <!-- favicons -->

    <link rel="icon" href="{{assetsUri}}/common/icons/favicons/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="{{assetsUri}}/common/icons/favicons/favicon.svg">
    <link rel="apple-touch-icon" href="{{assetsUri}}/common/icons/favicons/apple-touch-icon.png">

    <link rel="manifest" href="{{assetsUri}}/common/icons/favicons/manifest.webmanifest">
    <link rel="stylesheet" type="text/css" href="{{assetsUri}}/main.css">
</head>
<body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>

    <script type="application/json" id="{{configScriptId}}">{{{configAsJson}}}</script>
    <script src="{{assetsUri}}/main.js" data-config-script-id="{{configScriptId}}" data-ws-service-url="{{wsServiceUrl}}"></script>
</body>
</html>
